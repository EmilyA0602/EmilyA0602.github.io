<!DOCTYPE html>
<html>
<head>
  <title>My Fractal Page</title>


  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.2/lib/p5.min.js"></script>
  <script src="sketch.js"></script>


  <style>
    body {
      background-color: #8ab7ff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 25px;
    }


    .page-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 25px;
      align-items: start;
    }


    .main-content {
      min-width: 0;
    }


    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 20px;
    }


    .card {
      background: white;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    }


    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }


    iframe {
      display: block;
      width: 100%;
      border: none;
    }


    @media (max-width: 700px) {
      .page-layout {
        grid-template-columns: 1fr;
      }


      .sidebar {
        position: static;
      }
    }
  </style>
</head>


<body>


  <div class="page-layout">


    <!-- MAIN WEBSITE CONTENT -->
    <div class="main-content">
      <h1>My Website</h1>
      <p>Created with p5.js.</p>


      <a href="https://editor.p5js.org/344876255/full/c2TlhGUg3">
        Visit p5.js
      </a>


      <!-- Your p5.js sketch will appear here -->
    </div>




    <!-- RIGHT SIDEBAR -->
    <div class="sidebar">


      <!-- SPOTIFY WIDGET -->
      <div class="card">
        <h2>♫ My Spotify</h2>
        <p>Now playing: Sweet Child O' Mine ♡</p>


        <iframe
          style="border-radius:12px"
          src="https://open.spotify.com/embed/track/2sTBBvprdXH4eGOOT41fhw"
          height="152"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      </div>




      <!-- WEATHER WIDGET -->
      <div class="card">
        <h2>☁ Toronto Weather</h2>


        <a
          class="weatherwidget-io"
          href="https://forecast7.com/en/43d65n79d38/toronto/"
          data-label_1="TORONTO"
          data-label_2="WEATHER"
          data-theme="original">
          TORONTO WEATHER
        </a>


        <script>
          !function(d,s,id) {
            var js, fjs = d.getElementsByTagName(s)[0];


            if (!d.getElementById(id)) {
              js = d.createElement(s);
              js.id = id;
              js.src = 'https://weatherwidget.io/js/widget.min.js';
              fjs.parentNode.insertBefore(js,fjs);
            }
          }(document,'script','weatherwidget-io-js');
        </script>
      </div>


    </div>
  </div>


</body>
</html>
